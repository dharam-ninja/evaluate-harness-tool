[project]
name = "harness-eval"
version = "0.1.0"
description = "Paired baseline-vs-candidate evaluation for coding-agent harness changes"
requires-python = ">=3.10"
dependencies = [
    "typer>=0.12",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "rich>=13.7",
    "jinja2>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5", "mypy>=1.10"]

[project.scripts]
harness-eval = "harness_eval.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/harness_eval"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.mypy]
python_version = "3.10"

[tool.ruff.lint]
# typer's API requires the call in the argument default; there is no other way to
# declare CLI metadata with it.
ignore = ["B008"]
