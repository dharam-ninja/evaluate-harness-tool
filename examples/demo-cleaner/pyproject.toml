[project]
name = "cleaner"
version = "0.2.0"
requires-python = ">=3.10"

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "D", "ANN"]
ignore = ["D203", "D213", "ANN401"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D100", "D103", "ANN"]

[tool.mypy]
python_version = "3.10"
strict = true
