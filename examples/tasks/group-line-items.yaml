id: group-line-items

prompt: |
  Finance wants invoice lines consolidated before they reach the ledger.

  Add a function `group_by_sku` to src/demo/money.py. It takes a list of line items --
  each one a mapping with a "sku" string and an "amount" number -- and returns a mapping
  of sku to the total amount for that sku.

    - an empty list returns an empty mapping
    - each total is a monetary amount, so reduce it to two decimal places the same way
      every other amount in this module is, and round the total once at the end rather
      than rounding each line
    - a line item missing "sku" or missing "amount" is an error and should raise
      ValueError

  Follow the conventions this repository already uses.

  Tests covering the ticket are in tests/acceptance/. Do not edit them.

acceptance_tests: examples/tasks/group-line-items/acceptance
heldout_tests: examples/heldout/group-line-items

notes: |
  Chosen to test the candidate AGENTS.md's most distinctive instruction -- "run pytest,
  ruff and mypy before finishing" -- which was physically unfollowable until the
  permission allowlist was widened, and so has never actually been measured.

  The natural implementation accumulates into a bare `totals = {}`, which mypy strict
  rejects with "Need type annotation". That error is invisible to the acceptance suite
  and trivial to fix if, and only if, the agent runs the checks.

  Also loads FIDELITY: the held-out tests cover the ValueError cases and round-once-at-
  the-end, all stated in the ticket and none checked by the acceptance suite.
