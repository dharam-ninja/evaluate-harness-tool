id: apply-discount

prompt: |
  Sales want to show discounted prices at checkout.

  Add a function `apply_discount` to src/demo/money.py that takes an amount and a
  discount percentage and returns the final price.

    - the percentage is a whole or fractional number between 0 and 100 inclusive;
      anything outside that range is an error and should raise ValueError
    - a 0% discount returns the original amount, and a 100% discount returns 0.00
    - the result is a monetary amount, so it must be reduced to two decimal places the
      same way every other amount in this module is -- do not invent a second rounding
      rule alongside the existing one

  Tests covering the ticket are in tests/acceptance/. Do not edit them.

acceptance_tests: examples/tasks/apply-discount/acceptance
heldout_tests: examples/heldout/apply-discount

notes: |
  Loads FIDELITY. The ticket states the validation rules and the "reuse the existing
  rounding rule" requirement in full. The acceptance suite checks neither: all three of
  its cases are exact to the cent, so a hand-rolled `round(x, 2)` passes them.

  The held-out rounding test is asserted against `round_money` itself rather than a
  literal, so it stays correct whatever that function currently does -- it tests
  delegation, not a value.
